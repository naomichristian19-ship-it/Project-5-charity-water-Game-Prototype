
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clean Water Challenge</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <h1>Clean Water Challenge</h1>
  <p>Transfer every drop. Waste less water!</p>

  <div class="game-info">
    <p>Score: <span id="score">0</span></p>
    <p>Time: <span id="timer">60</span></p>
  </div>

  <button id="start-button">Begin Game</button>

  <div id="game-area">
    <!-- Your buckets will go here -->
  </div>

  <p id="feedback"></p>
</body>
</html>
